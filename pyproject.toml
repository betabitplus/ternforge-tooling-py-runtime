# ==============================================================================
# Build System Configuration
# ==============================================================================
[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=82.0.1" ]

# ==============================================================================
# Project Metadata
# ==============================================================================
[project]
name = "py-lib-runtime"
version = "1.1.1"
description = "Shared runtime support helpers for py-lib Python libraries."
readme = "README.md"
keywords = [ "cache", "library", "logging", "python", "runtime" ]
license = "MIT"
authors = [ { name = "betabitplus", email = "8123085+betabitplus@users.noreply.github.com" } ]
requires-python = ">=3.13"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [ "structlog>=25.5" ]
optional-dependencies.cache = [ "diskcache>=5.6" ]
urls."Bug Tracker" = "https://github.com/betabitplus/ternforge-tooling-py-runtime/issues"
urls.Documentation = "https://github.com/betabitplus/ternforge-tooling-py-runtime/tree/main/docs"
urls.Homepage = "https://github.com/betabitplus/ternforge-tooling-py-runtime"
urls.Repository = "https://github.com/betabitplus/ternforge-tooling-py-runtime"

# ==============================================================================
# Development Dependencies
# ==============================================================================
[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "build>=1.5.0",
  "check-manifest>=0.51",
  "check-wheel-contents>=0.6.1",
  "commitizen>=4.16.3",
  "deptry>=0.25.1",
  "diskcache>=5.6",
  "flake8>=7.3",
  "flake8-class-attributes-order>=0.3",
  "flake8-cognitive-complexity>=0.1",
  "hypothesis>=6.152.4",
  "import-linter>=2.11",
  "interrogate>=1.7",
  "ipykernel>=7.2.0",
  "ipython>=9.14.1",
  "nest-asyncio>=1.6",
  "pillow>=12.2",
  "pip-audit>=2.10.1",
  "pre-commit>=4.6.0",
  "pyright>=1.1.408",
  "pytest>=9.1.0",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=4.1.0",
  "pytest-recording>=0.13.4",
  "pytest-xdist>=3.8.0",
  "radon>=6.0.1",
  "rich>=15",
  "ruff>=0.15.15",
  "syrupy>=5.3.2",
  "twine>=6.2.0",
  "ty>=0.0.50",
  "types-pillow>=10.2.0.20240822",
  "wheel>=0.47.0",
]

# ==============================================================================
# Setuptools Configuration
# ==============================================================================
[tool.setuptools]
packages.find.where = [ "src" ]
packages.find.include = [ "py_lib_runtime*" ]
package-dir."" = "src"

# ---------------- Import-linter architecture contracts ----------------
[tool.uv]
required-version = "==0.12.0"

# ==============================================================================
# Python Quality Tooling
# ==============================================================================
[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [ "build" ]
fix = true
format.docstring-code-format = true
lint.select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "COM",
  "D",
  "DTZ",
  "E",
  "EM",
  "F",
  "I",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "PT",
  "PTH",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
]
lint.ignore = [
  "COM812",
  "ISC001",
  "PLC0415",
  "TC001",
  "TC002",
  "TC003",
]
lint.per-file-ignores."examples/*" = [ "T20" ]
lint.per-file-ignores."tests/*" = [ "ANN", "D", "S101" ]
lint.flake8-tidy-imports.ban-relative-imports = "all"
lint.isort.combine-as-imports = true
lint.isort.known-first-party = [ "py_lib_runtime" ]
lint.pydocstyle.convention = "google"

[tool.interrogate]
fail-under = 100
# Require docstrings in production code.
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
ignore-overloaded-functions = true
ignore-regex = [ "^wrapper$" ]
exclude = [ ".agents", ".artifact-smoke*", "docs", "scripts", "tests" ]
color = true
verbose = 1
quiet = false
omit-covered-files = true

# ---------------- Manifest validation ----------------
[tool.check-manifest]
ignore = [
  "*.egg-info/**",
  ".agents/**",
  ".copier-answers.yml",
  ".devcontainer/**",
  ".git/**",
  ".github/**",
  ".gitleaks.toml",
  ".markdown-link-check.json",
  ".markdownlint.yaml",
  ".mdformat.toml",
  ".pre-commit-config.yaml",
  ".pytest_cache/**",
  ".release-please-manifest.json",
  ".ruff_cache/**",
  ".venv/**",
  ".vscode/**",
  "__pycache__/**",
  "docs/**",
  "examples/**",
  "plan/**",
  "release-please-config.json",
  "scripts/**",
  "SETUP.md",
  "tests/**",
  "typos.toml",
  "uv.lock",
  "workbench/**",
]

# ---------------- Deptry (dependency hygiene) ----------------
[tool.deptry]
extend_exclude = [
  ".agents",
  ".artifact-smoke*",
  ".venv",
  "examples",
  "scripts",
  "tests",
  "workbench",
]
known_first_party = [ "py_lib_runtime" ]

# ---------------- Bandit (security) ----------------
[tool.bandit]
exclude_dirs = [ ".agents", ".venv", "scripts", "tests" ]

[tool.pyright]
pythonVersion = "3.13"
venv = ".venv"
venvPath = "."
typeCheckingMode = "strict"
exclude = [
  "**/__pycache__",
  ".agents",
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
]
reportArgumentType = false
reportAttributeAccessIssue = false
reportMissingTypeStubs = false
reportReturnType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
executionEnvironments = [ { root = "." } ]

# ---------------- Pyright configuration ----------------
[tool.ty]
# Exclude patterns matching Pyright configuration.
src.exclude = [
  "**/__pycache__/",
  "*.egg-info/",
  ".agents/",
  ".artifact-smoke*/",
  ".devcontainer/",
  ".git/",
  ".github/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".venv/",
  ".vscode/",
  "scripts/",
  "tests/",
]
# ---------------- ty (Astral type checker) ----------------
environment.python-version = "3.13"
# Suppress rules that generate false positives or conflict with Pyright settings.
rules.invalid-argument-type = "ignore"
rules.invalid-assignment = "ignore"
rules.invalid-return-type = "ignore"
rules.possibly-missing-attribute = "ignore"
rules.unknown-argument = "ignore"
rules.unresolved-attribute = "ignore"

[tool.pytest]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = "-q"
ini_options.markers = [
  "e2e_behavior: end-to-end behavior tests",
  "e2e_contract: end-to-end public contract tests",
  "hermetic: marks tests that run fully offline",
  "slow: marks tests that are slow and should be skipped in fast runs",
  "vcr: marks tests that use VCR.py for HTTP recording/replay",
]

[tool.coverage]
run.source = [ "src" ]
# ---------------- pytest coverage ----------------
report.fail_under = 1

# ==============================================================================
# Shared py-lib Tooling Manifest
# ==============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
allowed_prefixes = [ "Merge", "Revert", "WIP" ]
version_provider = "pep621"
version_files = [ "src/py_lib_runtime/__init__.py:__version__" ]
major_version_zero = true
tag_format = "py-lib-runtime-v$version"
annotated_tag = true
update_changelog_on_bump = false

# ==============================================================================
# Import Linter Architecture Contracts
# ==============================================================================
[tool.importlinter]
root_packages = [
  "examples",
  "py_lib_runtime",
  "tests",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Root package must not be imported by the private implementation"
id = "root-not-imported-by-private-implementation"
type = "forbidden"
source_modules = [ "py_lib_runtime._internal" ]
forbidden_modules = [ "py_lib_runtime" ]
as_packages = false

[[tool.importlinter.contracts]]
name = "Root package must not be imported by the facade layer"
id = "root-not-imported-by-facade-layer"
type = "forbidden"
source_modules = [ "py_lib_runtime._api" ]
forbidden_modules = [ "py_lib_runtime" ]
as_packages = false

[[tool.importlinter.contracts]]
name = "Private implementation must not depend on public config facade"
id = "private-implementation-not-dependent-on-config-facade"
type = "forbidden"
source_modules = [ "py_lib_runtime._internal" ]
forbidden_modules = [ "py_lib_runtime._api.config" ]
as_packages = false

[[tool.importlinter.contracts]]
name = "Private implementation is only imported through product code and explicit private-boundary test layers"
id = "private-implementation-approved-boundaries"
type = "protected"
protected_modules = [ "py_lib_runtime._internal" ]
allowed_importers = [
  "py_lib_runtime._api",
  "py_lib_runtime._internal",
  "tests.py_lib_runtime.integration",
  "tests.py_lib_runtime.property_based.internal",
  "tests.py_lib_runtime.unit",
]

[[tool.importlinter.contracts]]
name = "Facade layer must import private implementation only through the private root"
id = "facade-private-imports-through-root"
type = "forbidden"
source_modules = [ "py_lib_runtime._api" ]
forbidden_modules = [ "py_lib_runtime._internal.**" ]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Py-lib-runtime public-contract verification modules must not import private implementation"
id = "py-lib-runtime-public-contract-boundary"
type = "forbidden"
source_modules = [
  "tests.py_lib_runtime.e2e",
  "tests.py_lib_runtime.property_based.public_contract",
  "tests.py_lib_runtime.support",
]
forbidden_modules = [ "py_lib_runtime._internal", "src" ]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Py-lib-runtime examples must use the public package API"
id = "py-lib-runtime-examples-public-api"
type = "forbidden"
source_modules = [ "examples.py_lib_runtime" ]
forbidden_modules = [ "py_lib_runtime._api", "py_lib_runtime._internal", "src" ]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Py-lib-runtime shipped package must not import examples"
id = "py-lib-runtime-shipped-package-examples-boundary"
type = "forbidden"
source_modules = [ "py_lib_runtime" ]
forbidden_modules = [ "examples" ]
allow_indirect_imports = true

# ---------------- Commitizen (conventional commits + changelog) ----------------
[tool.pip-audit]
# Ignore vulnerabilities that are not applicable or have no fix yet.
ignore-vulns = []

[tool.ternforge]
primary_package = "py_lib_runtime"
package_names = [ "py_lib_runtime" ]
library_lane = "standard-lib"
env_prefix = "PY_LIB_RUNTIME"
secrets.env_files = []
# ---------------- Pip Audit (dependency vulnerability scanning) ----------------
