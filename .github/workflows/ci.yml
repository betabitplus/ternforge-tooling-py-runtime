name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    uses: betabitplus/ternforge-infra-ci/.github/workflows/python-library.yml@a5b1001af5718e07a51b4443135b39dc32deb247 # v5.0.3
    with:
      python-version: "3.13"
      runtime-audit-exclude-package: ""
      playwright-browsers: ""
