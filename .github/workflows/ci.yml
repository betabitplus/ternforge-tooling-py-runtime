name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    uses: betabitplus/ternforge-infra-ci/.github/workflows/python-library.yml@784ffb89f7129997b65022adee0f934ea3ff4206 # v4.0.0
    with:
      python-version: "3.13"
      policy-command: ""
      runtime-audit-exclude-package: ""
      playwright-browsers: ""
