name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    uses: betabitplus/ternforge-infra-ci/.github/workflows/python-library.yml@e8ac2be1a44a5011309318f9c537eafda9bd4fad # v2.0.1
    with:
      python-version: "3.13"
      policy-command: ""
      runtime-audit-exclude-package: ""
