name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    uses: betabitplus/ternforge-infra-ci/.github/workflows/python-library.yml@52fcae0a1b0631a00da6a135f92c4857d0a243ab # v5.0.5
    with:
      python-version: "3.13"
      runtime-audit-exclude-package: ""
      playwright-browsers: ""
