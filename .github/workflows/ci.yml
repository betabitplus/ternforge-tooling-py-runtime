name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    uses: betabitplus/ternforge-infra-ci/.github/workflows/python-library.yml@de9b85642b710afbbff71821ed5fcaad4be3e1c9 # v5.0.1
    with:
      python-version: "3.13"
      runtime-audit-exclude-package: ""
      playwright-browsers: ""
