name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    uses: betabitplus/ternforge-infra-ci/.github/workflows/python-library.yml@5371af254374136022cf3147a93b6fea5bb5fd7e # v2.0.0
    with:
      python-version: "3.13"
      policy-command: ""
      runtime-audit-exclude-package: ""
