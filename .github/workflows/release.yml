name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: betabitplus/ternforge-infra-ci/.github/workflows/release.yml@5371af254374136022cf3147a93b6fea5bb5fd7e # v2.0.0
    with:
      app-client-id: ${{ vars.TERNFORGE_RELEASE_CLIENT_ID }}
      repository: ${{ github.event.repository.name }}
      release-type: python
      synchronize-python-lock: true
      dispatch-app-client-id: ${{ vars.TERNFORGE_DISPATCH_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.TERNFORGE_RELEASE_PRIVATE_KEY }}
      dispatch-app-private-key: ${{ secrets.TERNFORGE_DISPATCH_PRIVATE_KEY }}
