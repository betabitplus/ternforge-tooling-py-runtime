name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ${{ vars.TERNFORGE_RUNNER || 'ubuntu-slim' }}
    timeout-minutes: 15
    environment: release
    steps:
      - name: Run release automation
        uses: betabitplus/ternforge-infra-ci/.github/actions/release@621e39cb96e1654207b1ac3e410aeeeb93acda14 # v5.1.8
        with:
          app-client-id: ${{ vars.TERNFORGE_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.TERNFORGE_RELEASE_PRIVATE_KEY }}
          synchronize-python-lock: "true"
          source-read-client-id: ${{ vars.TERNFORGE_SOURCE_READ_CLIENT_ID }}
          source-read-private-key: ${{ secrets.TERNFORGE_SOURCE_READ_PRIVATE_KEY }}
