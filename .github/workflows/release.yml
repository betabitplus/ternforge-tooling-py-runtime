name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-slim
    timeout-minutes: 15
    environment: release
    steps:
      - name: Run release automation
        uses: betabitplus/ternforge-infra-ci/.github/actions/release@6e9126dbe5007166f7fccce6cbddb25ff917f67c # v5.0.7
        with:
          app-client-id: ${{ vars.TERNFORGE_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.TERNFORGE_RELEASE_PRIVATE_KEY }}
          synchronize-python-lock: "true"
          source-read-client-id: ${{ vars.TERNFORGE_SOURCE_READ_CLIENT_ID }}
          source-read-private-key: ${{ secrets.TERNFORGE_SOURCE_READ_PRIVATE_KEY }}
